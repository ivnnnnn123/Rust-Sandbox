[package]
name = "rust_sandbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sandbox"
path = "src/main.rs"

[[bin]]
name = "sandbox_server"
path = "src/server.rs"

[dependencies]
libc = "0.2"
seccompiler = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.29", features = ["sched", "process", "resource", "user", "fs"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tiny_http = "0.12"
uuid = { version = "1.0", features = ["v4"] }